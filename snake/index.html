<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { background: #1b1b1b; border: 2px solid #333; max-width: 95vw; height: auto; }
  #hud { margin: 8px; font-size: 18px; }
  #msg { margin: 8px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div id="hud">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Arrows/WASD or swipe to move. Space to pause.</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const N = 20, S = canvas.width / N;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

let best = 0;
try { best = +localStorage.getItem('snakeBest') || 0; } catch (e) {}
bestEl.textContent = best;

let snake, dir, queue, food, score, over, paused, timer;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  queue = [];
  score = 0;
  over = false;
  paused = false;
  scoreEl.textContent = 0;
  msgEl.textContent = 'Arrows/WASD or swipe to move. Space to pause.';
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, 110);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)};
  } while (snake.some(p => p.x === food.x && p.y === food.y));
}

function turn(x, y) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (last.x === -x && last.y === -y) return;
  if (last.x === x && last.y === y) return;
  if (queue.length < 3) queue.push({x, y});
}

function tick() {
  if (paused || over) return;
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      body.some(p => p.x === head.x && p.y === head.y)) {
    over = true;
    msgEl.textContent = 'Game over! Press Space/Enter or tap to restart.';
    draw();
    return;
  }
  snake.unshift(head);
  if (eating) {
    score++;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snakeBest', best); } catch (e) {}
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
  snake.forEach((p, i) => {
    ctx.fillStyle = i === 0 ? '#7bed9f' : '#2ecc71';
    ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
  });
  if (over || paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(over ? 'GAME OVER' : 'PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') turn(0, -1);
  else if (k === 'arrowdown' || k === 's') turn(0, 1);
  else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
  else if (k === 'arrowright' || k === 'd') turn(1, 0);
  else if (k === ' ' || k === 'enter') {
    if (over) reset();
    else { paused = !paused; draw(); }
  } else return;
  e.preventDefault();
});

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (over) { reset(); return; }
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
  else turn(0, dy > 0 ? 1 : -1);
});

reset();
draw();
</script>
</body>
</html>
